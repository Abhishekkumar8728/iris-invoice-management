services:
  mongodb:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - iris-mongodb-data:/data/db
    networks:
      - iris-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  auth-service:
    build: ./services/auth-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4001
      MONGO_URI: mongodb://mongodb:27017/iris_auth
      USER_SERVICE_URL: http://user-service:4002
      NOTIFICATION_SERVICE_URL: http://notification-service:4004
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?INTERNAL_SERVICE_KEY is required}
      ADMIN_BOOTSTRAP_ENABLED: ${ADMIN_BOOTSTRAP_ENABLED:-false}
      ADMIN_BOOTSTRAP_KEY: ${ADMIN_BOOTSTRAP_KEY:-}
    depends_on:
      mongodb:
        condition: service_healthy
      user-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    networks:
      - iris-network

  user-service:
    build: ./services/user-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4002
      MONGO_URI: mongodb://mongodb:27017/iris_users
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?INTERNAL_SERVICE_KEY is required}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - iris-network

  invoice-service:
    build: ./services/invoice-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4003
      MONGO_URI: mongodb://mongodb:27017/iris_invoices
      UPLOAD_DIR: /app/uploads
      USER_SERVICE_URL: http://user-service:4002
      NOTIFICATION_SERVICE_URL: http://notification-service:4004
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?INTERNAL_SERVICE_KEY is required}
    depends_on:
      mongodb:
        condition: service_healthy
      user-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    volumes:
      - invoice-uploads:/app/uploads
    networks:
      - iris-network

  notification-service:
    build: ./services/notification-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4004
      MONGO_URI: mongodb://mongodb:27017/iris_notifications
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?INTERNAL_SERVICE_KEY is required}
      EMAIL_ENABLED: ${EMAIL_ENABLED:?EMAIL_ENABLED is required}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@example.com}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - iris-network

  api-gateway:
    build: ./api-gateway
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      AUTH_SERVICE_URL: http://auth-service:4001
      USER_SERVICE_URL: http://user-service:4002
      INVOICE_SERVICE_URL: http://invoice-service:4003
      NOTIFICATION_SERVICE_URL: http://notification-service:4004
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?INTERNAL_SERVICE_KEY is required}
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      invoice-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    ports:
      - "${GATEWAY_PORT:-4000}:4000"
    networks:
      - iris-network

volumes:
  iris-mongodb-data:
  invoice-uploads:

networks:
  iris-network:
    driver: bridge
