<aside class="app-sidebar" [class.sidebar-open]="isOpen" [class.sidebar-closed]="!isOpen">

  @if (isOpen) {

  

  <div class="sidebar-header">

    <div class="brand-area">

      <div class="vw-logo">

        <img src="assets/images/comapnylogo.png" alt="Volkswagen" />

      </div>

      <div class="brand-text">

        <div class="brand-title">
          Volkswagen
        </div>

        <div class="brand-subtitle">
          IRIS Invoice Management
        </div>

      </div>

    </div>


    <button type="button" class="sidebar-close-button" (click)="toggleSidebar()" aria-label="Close navigation"
      title="Close navigation">

      <i class="bi bi-x-lg"></i>

    </button>

  </div>


  

  <nav class="sidebar-navigation">

    

    <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
      class="sidebar-item" (click)="onNavigation()">

      <span class="sidebar-icon">
        <i class="bi bi-grid"></i>
      </span>

      <span class="sidebar-label">
        Dashboard
      </span>

      <span class="sidebar-arrow">
        <i class="bi bi-chevron-right"></i>
      </span>

    </a>


    

    <a routerLink="/invoices" routerLinkActive="active" class="sidebar-item" (click)="onNavigation()">

      <span class="sidebar-icon">
        <i class="bi bi-file-earmark-text"></i>
      </span>

      <span class="sidebar-label">
        Invoices
      </span>

      <span class="sidebar-arrow">
        <i class="bi bi-chevron-right"></i>
      </span>

    </a>



    

    <a routerLink="/vendors" routerLinkActive="active" class="sidebar-item" (click)="onNavigation()">

      <span class="sidebar-icon">
        <i class="bi bi-people"></i>
      </span>

      <span class="sidebar-label">
        Vendors
      </span>

      <span class="sidebar-arrow">
        <i class="bi bi-chevron-right"></i>
      </span>

    </a>


    

    <a routerLink="/reports" routerLinkActive="active" class="sidebar-item" (click)="onNavigation()">

      <span class="sidebar-icon">
        <i class="bi bi-bar-chart"></i>
      </span>

      <span class="sidebar-label">
        Reports
      </span>

      <span class="sidebar-arrow">
        <i class="bi bi-chevron-right"></i>
      </span>

    </a>


    

    <a routerLink="/notifications" routerLinkActive="active" class="sidebar-item" (click)="onNavigation()">

      <span class="sidebar-icon">
        <i class="bi bi-bell"></i>
      </span>

      <span class="sidebar-label">
        Notifications
      </span>

      @if (unreadNotifications > 0) {

      <span class="notification-count">
        {{
        unreadNotifications > 99
        ? '99+'
        : unreadNotifications
        }}
      </span>

      }

      <span class="sidebar-arrow">
        <i class="bi bi-chevron-right"></i>
      </span>

    </a>


  </nav>

  <div class="sidebar-promo">
    <img src="assets/images/volkeswagen car.png" alt="Volkswagen electric car" />
  </div>

  

  <div class="sidebar-footer">

    <div class="footer-wave"></div>

    <div class="company-information">

      <div class="company-icon">
        <img src="assets/images/comapnylogo.png" alt="" />
      </div>

      <div class="company-details">

        <div class="company-name">
          Volkswagen Group
        </div>

        <div class="company-product">
          IRIS Invoice Platform
        </div>

        <div class="company-version">
          Enterprise Edition&nbsp;&nbsp;v1.0.0
        </div>

      </div>

    </div>

  </div>

  }

</aside>
